<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Aluno - DSM</title>

</head>

<body>


    <h1>Cadastro de Aluno  DSM</h1>


    <p>

        Este formulário tem como finalidade realizar o cadastro de alunos

        interessados nos cursos oferecidos pela instituição.

    </p>


    


        <fieldset>

            <legend>Dados Pessoais</legend>


            <p>

                <label for="nome">Nome completo:</label><br>

                <input type="text" id="nome" name="nome" required>

            </p>


            <p>

                <label for="email">E-mail:</label><br>

                <input type="email" id="email" name="email" required>

            </p>


            <p>

                <label for="dataNascimento">Data de nascimento:</label><br>

                <input type="date" id="dataNascimento" name="dataNascimento">

            </p>

        </fieldset>


        <fieldset>

            <legend>Dados Acadêmicos</legend>


            <p>

                <label for="curso">Curso:</label><br>

                <select id="curso" name="curso">

                    <option value="DSM">DSM</option>

                    <option value="ADS">ADS</option>

                    <option value="Outro">Outro</option>

                </select>

            </p>


            <p>

                Período:

                <br>


                <input type="radio" id="manha" name="periodo" value="Manhã">

                <label for="manha">Manhã</label>


                <input type="radio" id="noite" name="periodo" value="Noite">

                <label for="noite">Noite</label>

            </p>


            <p>

                <label for="observacoes">Observações:</label><br>

                <textarea id="observacoes" name="observacoes" rows="4" cols="40"></textarea>

            </p>

        </fieldset>


        <p>

            <button type="submit">Enviar</button>

            <button type="reset">Limpar</button>

        </p>


    </form>


</body>

</html>
