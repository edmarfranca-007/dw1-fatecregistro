<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>tabelas</title>
</head>
<body>
    <h1>tabelas no html5</h1>
    <!-- Estrutura minima de uma Tabela -->
     <table>
<tr>
<td>dado 1</td>
<td>dado 2</td>
<td>dado 3</td>
</tr>
<tr>
<td>dado 4</td>
<tr>dado 5</tr>
<tr>dado 6</tr>
</tr>

     </table> 
     <!-- br:breck line (quebra de linha ) -->
     <br><br><br>
      <!--Exemplo de tabela completa (com mesclagem)  -->
      <table border="1"
      <caption> vendas do mês</caption>
      <!-- cabecalho da tabela  -->
       <thead>
        <tr>
            <th> produto</th>
            <th>quantidade</th>
            <th>valor</th>
        </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">mouse</td>
                <td>10</td>
                <td>500.00</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th aria-colspan="2">total</th>
                <td>1.500,00</td>
            </tr>
            
        </tfoot>
    </table>
    <br><br><br>
    <table border="1">
    <caption>notas de aluno por diciplina </caption>
    <thead>
        <tr>
             <th scope="col">ana</th>
     </thead>
     <tbody>
        <tr>
            <th scope="row"
        
        
        
        </tr>

     </tbody>

    </thead>    
</body>
</html>
